<!DOCTYPE html>
<html>
<head>
    <title>Reset Password</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; }
        .container { max-width: 400px; margin: auto; padding: 20px; border: 1px solid #ddd; border-radius: 5px; }
        input { width: 100%; padding: 10px; margin: 10px 0; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; cursor: pointer; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Reset Your Password</h2>
        <div id="message"></div>
        <input type="password" id="newPassword" placeholder="New Password">
        <input type="password" id="confirmPassword" placeholder="Confirm Password">
        <button onclick="resetPassword()">Reset Password</button>
    </div>

    <script>
        async function resetPassword() {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (newPassword !== confirmPassword) {
                document.getElementById('message').innerHTML = '<div class="error">Passwords do not match</div>';
                return;
            }
            
            try {
                const response = await fetch('http://localhost:8080/api/v1/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, new_password: newPassword, confirm_password: confirmPassword })
                });
                
                const data = await response.json();
                if (response.ok) {
                    document.getElementById('message').innerHTML = '<div class="success">' + data.message + '</div>';
                    setTimeout(() => { window.location.href = '/login.html'; }, 3000);
                } else {
                    document.getElementById('message').innerHTML = '<div class="error">' + data.error + '</div>';
                }
            } catch (error) {
                document.getElementById('message').innerHTML = '<div class="error">An error occurred</div>';
            }
        }
    </script>
</body>
</html>
